# Construit et publie l'image sur ghcr.io à chaque tag vX.Y.Z, puis affiche l'empreinte à reporter dans le catalogue.
name: Publier l'image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/nabief/desktroo-remote:${{ github.ref_name }}
            ghcr.io/nabief/desktroo-remote:latest
      - name: Empreinte pour le catalogue
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "Version : \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Empreinte à mettre dans catalog.json : \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
