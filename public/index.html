<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktroo Remote</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="../_sdk/desktroo-app.css">
<script src="../_sdk/desktroo-app.js"></script>
<!-- Desktroo Remote — © 2026 Mdm-services.fr. Tous droits réservés. -->
<style>
  /* Comme les fenêtres de Desktroo : cartes et champs en voile sur le fond de la fenêtre (--bg, envoyé par le bureau),
     pour suivre tous les thèmes au lieu des surfaces fixes du kit. */
  :root { --card: rgba(255,255,255,0.06); --field: rgba(0,0,0,0.20); --card-solid: rgba(255,255,255,0.08); }
  :root[data-theme="light"] { --card: rgba(255,255,255,0.62); --field: rgba(255,255,255,0.88); --card-solid: rgba(255,255,255,0.75); }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) { --card: rgba(255,255,255,0.62); --field: rgba(255,255,255,0.88); --card-solid: rgba(255,255,255,0.75); } }
  .dk-input { background: var(--field); }
  .pane { display: none; } .pane.active { display: block; }
  a.dk-btn { text-decoration: none; }
  .actions a.dim { font-size: 12.5px; }
  a.dk-btn.disabled { opacity: .5; pointer-events: none; }
  .card { background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; max-width: 860px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; }
  .card p { margin: 6px 0; }
  .dim { color: var(--text-dim); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 12.5px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: 860px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { font-size: 12px; color: var(--text-dim); }
  .stat .v { font-size: 20px; font-weight: 700; font-family: var(--font-display); margin-top: 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); margin-right: 7px; vertical-align: 1px; flex-shrink: 0; }
  .dot.on { background: var(--success); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .dot.off { background: var(--danger); }
  .dot.busy { background: var(--warning); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .field { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .field .val { flex: 1; min-width: 0; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--field); border: 1px solid var(--glass-border); }
  .lbl { font-size: 12px; font-weight: 600; margin-top: 14px; }
  table.ports { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  table.ports td, table.ports th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--glass-border); }
  table.ports th { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  .warn { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.08); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer; margin-top: 12px; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .steps { margin: 8px 0 0; padding-left: 20px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .steps b { color: var(--text); font-weight: 600; }
  .search { max-width: 340px; }
  .devs { list-style: none; margin: 14px 0 0; padding: 0; max-width: 980px; }
  /* Fenêtre étroite : les boutons passent sous les infos du poste au lieu de les écraser. */
  .devs li { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; }
  .devs li > .dot { align-self: flex-start; margin-top: 6px; }
  .devs .main { flex: 1 1 300px; min-width: 0; }
  .devs .hint { flex-basis: 100%; font-size: 12.5px; padding: 8px 12px; border-radius: var(--radius-sm); background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35); }
  .devs .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .devs .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .devs .note { font-size: 12px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .devs .id { font-family: var(--font-mono); font-size: 13px; letter-spacing: .5px; }
  .devs .btns { display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .devs .btns .dk-btn { padding: 5px 11px; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: rgba(var(--accent-rgb),.16); color: var(--accent2); font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: 1px; }
  .badge.busy { background: rgba(245,158,11,.16); color: var(--warning); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; max-width: 640px; }
  pre.logs { background: var(--field); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: calc(100vh - 200px); overflow: auto; margin: 12px 0 0; }
  select.dk-input { width: auto; }
  dialog { border: 1px solid var(--glass-border); border-radius: var(--radius); background: linear-gradient(var(--card-solid), var(--card-solid)), var(--bg); color: var(--text); padding: 20px; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog textarea { width: 100%; min-height: 80px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--glass-border); background: var(--field); color: var(--text); font: 14px var(--font-body); resize: vertical; }
  dialog h2 { margin: 0 0 4px; }
  .addgrid { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-top: 6px; }
  @media (max-width: 760px) { .addgrid { grid-template-columns: 1fr; } }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--glass-border); font-size: 11.5px; margin-right: 6px; vertical-align: 1px; }
  .err { color: var(--danger); } .okc { color: var(--success); }
  dialog .lbl { margin: 16px 0 6px; }
  @media (max-width: 620px) { .devs .btns { width: 100%; justify-content: flex-start; margin-left: 0; } }
</style>
</head>
<body>
<div class="dk-shell">
  <nav class="dk-side">
    <div class="dk-side-title">Desktroo Remote</div>
    <button class="dk-nav active" data-pane="status"><span class="dk-nav-ic">◉</span><span class="dk-nav-name" data-t="nav_status"></span></button>
    <button class="dk-nav" data-pane="devices"><span class="dk-nav-ic">▣</span><span class="dk-nav-name" data-t="nav_devices"></span><span class="dk-count" id="count"></span></button>
    <button class="dk-nav" data-pane="deploy"><span class="dk-nav-ic">⇩</span><span class="dk-nav-name" data-t="nav_deploy"></span></button>
    <button class="dk-nav" data-pane="techs"><span class="dk-nav-ic">☺</span><span class="dk-nav-name" data-t="nav_techs"></span><span class="dk-count" id="tcount"></span></button>
    <div class="dk-side-fill"></div>
    <div class="dk-side-sep"></div>
    <button class="dk-nav" data-pane="logs"><span class="dk-nav-ic">≡</span><span class="dk-nav-name" data-t="nav_logs"></span></button>
    <div class="dk-side-note" id="side-note"></div>
  </nav>

  <section class="dk-main">
    <header class="dk-head">
      <div class="dk-head-text"><h1 class="dk-title" id="title"></h1><div class="dk-sub" id="sub"></div></div>
      <div class="dk-head-actions" id="head-actions"></div>
    </header>
    <div class="dk-body">

      <!-- État -->
      <div class="pane active" id="pane-status">
        <div class="card warn" id="host-warn" style="display:none"><b data-t="host_missing_t"></b><p class="dim" data-t="host_missing"></p></div>
        <div class="grid">
          <div class="stat"><div class="k" data-t="st_id"></div><div class="v"><span class="dot" id="dot-hbbs"></span><span id="st-hbbs">…</span></div><div class="dim" id="st-hbbs-sub"></div></div>
          <div class="stat"><div class="k" data-t="st_relay"></div><div class="v"><span class="dot" id="dot-hbbr"></span><span id="st-hbbr">…</span></div><div class="dim" id="st-hbbr-sub"></div></div>
          <div class="stat"><div class="k" data-t="st_devices"></div><div class="v" id="st-devices">…</div><div class="dim" id="st-devices-sub"></div></div>
        </div>
        <div class="card">
          <h2 data-t="srv_t"></h2>
          <p class="dim" data-t="srv_d"></p>
          <div class="lbl" data-t="srv_host"></div>
          <div class="field"><div class="val mono" id="v-host">…</div><button class="dk-btn" data-copy="v-host" data-t="copy"></button></div>
          <div class="lbl" data-t="srv_key"></div>
          <div class="field"><div class="val mono" id="v-key">…</div><button class="dk-btn" data-copy="v-key" data-t="copy"></button></div>
          <div class="lbl" data-t="srv_api"></div>
          <div class="field"><div class="val mono" id="v-api">…</div><button class="dk-btn" data-copy="v-api" data-t="copy"></button></div>
        </div>
        <div class="card">
          <h2 data-t="ports_t"></h2>
          <p class="dim" data-t="ports_d"></p>
          <table class="ports">
            <thead><tr><th data-t="ports_port"></th><th data-t="ports_proto"></th><th data-t="ports_role"></th></tr></thead>
            <tbody>
              <tr><td class="mono">21115</td><td>TCP</td><td data-t="role_nat"></td></tr>
              <tr><td class="mono">21116</td><td>TCP + UDP</td><td data-t="role_id"></td></tr>
              <tr><td class="mono">21117</td><td>TCP</td><td data-t="role_relay"></td></tr>
              <tr><td class="mono">21114</td><td>TCP</td><td data-t="role_api"></td></tr>
            </tbody>
          </table>
          <div class="actions"><button class="dk-btn" id="restart" data-t="restart"></button><span class="dim" id="restart-msg"></span></div>
        </div>
      </div>

      <!-- Postes -->
      <div class="pane" id="pane-devices">
        <input class="dk-input search" id="search" type="search" autocomplete="off">
        <ul class="devs" id="devs"></ul>
        <div class="empty" id="devs-empty" style="display:none"></div>
      </div>

      <!-- Déployer -->
      <div class="pane" id="pane-deploy">
        <div class="card">
          <h2 data-t="dl_t"></h2>
          <p class="dim" data-t="dl_d"></p>
          <div class="actions"><a class="dk-btn primary" id="dl-client" href="download/windows" data-t="dl_btn"></a><span class="dim" id="dl-ver"></span></div>
          <div class="lbl" data-t="dl_name"></div>
          <div class="field"><div class="val mono" id="v-fname">…</div><button class="dk-btn" data-copy="v-fname" data-t="copy"></button></div>
          <p class="dim" data-t="dl_name_d"></p>
        </div>
        <div class="card">
          <h2 data-t="ps_t"></h2>
          <p class="dim" data-t="ps_d"></p>
          <label class="check"><input type="checkbox" id="ps-pw"><span><b data-t="ps_pw"></b><br><span class="dim" data-t="ps_pw_d"></span></span></label>
          <div class="actions"><a class="dk-btn primary" id="dl-ps" href="deploy/windows.cmd" data-t="ps_btn"></a><a class="dim" id="dl-ps1" href="deploy/windows.ps1" data-t="ps1_link"></a></div>
          <ol class="steps" id="ps-steps"></ol>
        </div>
        <div class="card">
          <h2 data-t="other_t"></h2>
          <p class="dim" data-t="other_d"></p>
          <div class="lbl" data-t="other_cfg"></div>
          <div class="field"><div class="val mono" id="v-cfg">…</div><button class="dk-btn" data-copy="v-cfg" data-t="copy"></button></div>
          <ol class="steps" id="other-steps"></ol>
        </div>
      </div>

      <!-- Techniciens -->
      <div class="pane" id="pane-techs">
        <div class="card">
          <h2 data-t="api_t"></h2>
          <p class="dim" data-t="api_d"></p>
          <ol class="steps" id="api-steps"></ol>
          <div class="lbl" data-t="api_url"></div>
          <div class="field"><input class="dk-input mono" id="api-url" spellcheck="false" autocomplete="off"><button class="dk-btn primary" id="api-save" data-t="save"></button></div>
          <p class="dim" id="api-lan"></p>
          <div class="dim" id="api-msg"></div>
        </div>
        <div class="card" id="tech-setup">
          <h2 data-t="tp_t"></h2>
          <p class="dim" data-t="tp_d"></p>
          <div class="actions"><a class="dk-btn primary" id="dl-tech" href="deploy/windows.cmd?tech=1" data-t="tp_btn"></a><a class="dim" id="dl-tech1" href="deploy/windows.ps1?tech=1" data-t="ps1_link"></a></div>
          <div class="lbl" data-t="tp_cfg"></div>
          <div class="field"><div class="val mono" id="v-tcfg">…</div><button class="dk-btn" data-copy="v-tcfg" data-t="copy"></button></div>
          <ol class="steps" id="tp-steps"></ol>
        </div>
        <div class="card">
          <h2 data-t="acc_t"></h2>
          <p class="dim" data-t="acc_d"></p>
          <ul class="devs" id="techs"></ul>
          <div class="empty" id="techs-empty" data-t="acc_empty" style="display:none"></div>
          <div class="lbl" data-t="acc_add"></div>
          <div class="addgrid">
            <input class="dk-input" id="t-name" maxlength="32" autocomplete="off" spellcheck="false">
            <input class="dk-input" id="t-display" maxlength="60" autocomplete="off">
            <div class="field" style="margin:0"><input class="dk-input mono" id="t-pw" maxlength="256" autocomplete="new-password" spellcheck="false"><button class="dk-btn" id="t-gen" data-t="gen"></button></div>
          </div>
          <div class="actions"><button class="dk-btn primary" id="t-add" data-t="acc_add_btn"></button><span class="dim" id="t-msg"></span></div>
        </div>
      </div>

      <!-- Journal -->
      <div class="pane" id="pane-logs">
        <div class="actions" style="margin-top:0">
          <select class="dk-input" id="log-proc"><option value="hbbs"></option><option value="hbbr"></option></select>
          <button class="dk-btn" id="log-refresh" data-t="refresh"></button>
        </div>
        <pre class="logs" id="logs"></pre>
      </div>

    </div>
  </section>
</div>

<dialog id="edit">
  <h2 data-t="edit_t"></h2>
  <div class="dim mono" id="edit-id"></div>
  <div class="lbl" data-t="edit_label"></div>
  <input class="dk-input" id="edit-label" maxlength="60">
  <div class="lbl" data-t="edit_group"></div>
  <input class="dk-input" id="edit-group" maxlength="40" list="groups">
  <datalist id="groups"></datalist>
  <div class="lbl" data-t="edit_note"></div>
  <textarea id="edit-note" maxlength="300"></textarea>
  <div class="actions"><button class="dk-btn primary" id="edit-save" data-t="save"></button><button class="dk-btn" id="edit-cancel" data-t="cancel"></button></div>
</dialog>

<dialog id="pwd">
  <h2 data-t="pw_t"></h2>
  <div class="dim mono" id="pwd-name"></div>
  <div class="lbl" data-t="pw_new"></div>
  <div class="field" style="margin:0"><input class="dk-input mono" id="pwd-val" maxlength="256" autocomplete="new-password" spellcheck="false"><button class="dk-btn" id="pwd-gen" data-t="gen"></button></div>
  <p class="dim" data-t="pw_d"></p>
  <div class="actions"><button class="dk-btn primary" id="pwd-save" data-t="save"></button><button class="dk-btn" data-close data-t="cancel"></button></div>
</dialog>

<dialog id="totp">
  <h2 data-t="tf_t"></h2>
  <p class="dim" data-t="tf_d"></p>
  <div class="lbl" data-t="tf_key"></div>
  <div class="field" style="margin:0"><div class="val mono" id="totp-secret"></div><button class="dk-btn" data-copy="totp-secret" data-t="copy"></button></div>
  <p class="dim"><a id="totp-uri" href="#" data-t="tf_link"></a></p>
  <div class="lbl" data-t="tf_code"></div>
  <input class="dk-input mono" id="totp-code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="max-width:160px">
  <div class="dim err" id="totp-msg"></div>
  <div class="actions"><button class="dk-btn primary" id="totp-ok" data-t="tf_ok"></button><button class="dk-btn" data-close data-t="cancel"></button></div>
</dialog>

let LANG = 'fr';
function pickLang(l) { l = String(l || '').slice(0, 2).toLowerCase(); return I18N[l] ? l : (l ? 'en' : 'fr'); }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const notify = (t, l) => { if (window.desktroo && desktroo.inDesktroo) desktroo.notify(t, l); };

  $('tp-steps').innerHTML = ['tp_s1', 'tp_s2', 'tp_s3'].map((k) => '<li>' + T(k) + '</li>').join('');
  $('t-name').placeholder = T('ph_name'); $('t-display').placeholder = T('ph_display'); $('t-pw').placeholder = T('ph_pw');
  renderApiSteps();
  renderTechs();
  const o = $('log-proc').options; o[0].textContent = 'hbbs — ' + T('st_id'); o[1].textContent = 'hbbr — ' + T('st_relay');
  show(current, true);
  if (st) renderState();
  renderDevices();
}

function ago(ms) {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return T('ago_now');
  if (s < 3600) return T('ago_m', { n: Math.round(s / 60) });
  if (s < 86400) return T('ago_h', { n: Math.round(s / 3600) });
  return T('ago_d', { n: Math.round(s / 86400) });
}

async function api(path, opts) {
  let r;
  try { r = await fetch(path, Object.assign({ cache: 'no-store', headers: { 'Content-Type': 'application/json' } }, opts || {})); }
  catch (_) { throw new Error(T('err_net')); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(T('err_' + (data.error || 'server_error')));
  return data;
}

function show(pane, keep) {
  current = pane;
  document.querySelectorAll('.dk-nav').forEach((b) => b.classList.toggle('active', b.dataset.pane === pane));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.id === 'pane-' + pane));
  $('title').textContent = T('t_' + pane); $('sub').textContent = T('s_' + pane);
  if (window.desktroo) desktroo.setTitle('Desktroo Remote — ' + T('t_' + pane));
  if (!keep) { if (pane === 'logs') loadLogs(); if (pane === 'devices') loadDevices(); if (pane === 'deploy') loadClientVersion(); if (pane === 'techs') loadTechs(); }
}

function procLine(name, p) {
  $('dot-' + name).className = 'dot ' + (p.running ? 'on' : 'off');
  $('st-' + name).textContent = p.running ? T('running') : T('stopped');
  const parts = [];
  if (p.running && p.since) parts.push(T('since', { d: new Date(p.since).toLocaleString(LANG) }));
  if (p.restarts) parts.push(T('restarts', { n: p.restarts }));
  $('st-' + name + '-sub').textContent = parts.join(' · ');
}
function renderState() {
  procLine('hbbs', st.procs.hbbs); procLine('hbbr', st.procs.hbbr);
  $('st-devices').textContent = st.counts.online;
  $('st-devices-sub').textContent = T('dev_sub', { n: st.counts.total });
  $('count').textContent = st.counts.online || '';
  $('host-warn').style.display = st.hostOk ? 'none' : '';
  $('v-host').textContent = st.host || '—';
  $('v-key').textContent = st.key || '…';
  $('v-api').textContent = st.api || '—';
  $('v-cfg').textContent = st.config || '—';
  $('v-fname').textContent = st.filename || '—';
  $('v-tcfg').textContent = st.techConfig || T('tp_need_api');
  $('dl-tech').classList.toggle('disabled', !st.techConfig); $('dl-tech1').classList.toggle('disabled', !st.techConfig);
  if (document.activeElement !== $('api-url') && !apiDirty) $('api-url').value = st.apiUrl || '';
  $('api-url').placeholder = st.host ? 'https://' + st.host : 'https://…';
  $('tcount').textContent = st.techs || '';
  renderApiSteps();
  const ready = !!st.config;
  for (const id of ['dl-client', 'dl-ps', 'dl-ps1']) $(id).classList.toggle('disabled', !ready);
  $('side-note').textContent = st.serverVersion ? T('footer', { v: st.serverVersion }) : '';
}
async function loadState() {
  try { st = await api('api/state?lang=' + LANG); renderState(); } catch (e) { $('sub').textContent = e.message; }
}

// ── Techniciens ──
let techs = [], apiDirty = false, pwFor = null, totpFor = null;
function renderApiSteps() {
  // Desktroo ouvert par son adresse IP : c'est celle du NAS ; ouvert par un nom de domaine, on ne la connaît pas.
  const nasIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname) ? location.hostname : T('nas_ip');
  const host = esc((st && st.host) || 'remote.exemple.fr'), ip = esc(nasIp);
  $('api-steps').innerHTML = ['api_s1', 'api_s2', 'api_s3'].map((k) => '<li>' + T(k, { host, ip }) + '</li>').join('');
  $('api-lan').textContent = T('api_lan', { url: 'http://' + nasIp + ':' + ((st && st.lanPort) || 21120) });
}
function renderTechs() {
  const ul = $('techs'); if (!ul) return;
  ul.innerHTML = techs.map((t) => {
    const meta = [t.lastLogin ? T('t_last', { d: ago(t.lastLogin) }) : T('t_never'), t.sessions ? T('t_sessions', { n: t.sessions }) : ''].filter(Boolean).map(esc).join(' · ');
    const badges = (t.totp ? `<span class="badge">${esc(T('t_2fa'))}</span>` : '') + (t.disabled ? `<span class="badge busy">${esc(T('t_off'))}</span>` : '');
    return `<li data-name="${esc(t.name)}"><span class="dot ${t.disabled ? 'off' : (t.sessions ? 'on' : '')}"></span>
      <div class="main"><div class="name">${esc(t.display || t.name)}${badges}</div><div class="meta"><span class="id">${esc(t.name)}</span> · ${meta}</div></div>
      <div class="btns"><button class="dk-btn" data-t-act="pw">${esc(T('act_pw'))}</button>
        <button class="dk-btn" data-t-act="${t.totp ? '2fa-off' : '2fa-on'}">${esc(T(t.totp ? 'act_2fa_off' : 'act_2fa_on'))}</button>
        <button class="dk-btn" data-t-act="toggle">${esc(T(t.disabled ? 'act_enable' : 'act_disable'))}</button>
        ${t.sessions ? `<button class="dk-btn" data-t-act="logout">${esc(T('act_logout'))}</button>` : ''}
        <button class="dk-btn danger" data-t-act="del">${esc(T('act_del'))}</button></div></li>`;
  }).join('');
  $('techs-empty').style.display = techs.length ? 'none' : '';
}
async function loadTechs() { try { techs = await api('api/techs'); renderTechs(); } catch (e) { notify(e.message, 'error'); } }
function genPassword() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return Array.from(b, (x) => c[x % c.length]).join('').replace(/(.{4})(?=.)/g, '$1-');
}

function renderDevices() {
  const q = $('search').value.trim().toLowerCase();
  const list = devs.filter((d) => !q || [d.id, d.label, d.group, d.hostname, d.username, d.os, d.note, d.ip].join(' ').toLowerCase().includes(q));
  $('devs').innerHTML = list.map((d) => {
    const name = d.label || d.hostname || d.id;
    const state = d.inSession ? `<span class="badge busy">${esc(T('in_session'))}</span>` : (d.online ? `<span class="badge">${esc(T('online'))}</span>` : '');
    const seen = d.online ? '' : (d.lastSeen ? T('offline_ago', { d: ago(d.lastSeen) }) : T('never'));
    const os = d.os.includes(' / ') ? d.os.split(' / ').slice(1).join(' / ').replace(/\s+-\s+[\d.]+$/, '') : d.os;   // « windows / Windows 11 Pro - 10.0.26100 » → « Windows 11 Pro »
    const tag = d.group ? `<span class="tag">${esc(d.group)}</span>` : '';
    const meta = [d.label && d.hostname ? d.hostname : '', d.username, os, d.ip, seen].filter(Boolean).map(esc).join(' · ');
    const dot = d.inSession ? 'busy' : (d.online ? 'on' : '');
    return `<li data-id="${esc(d.id)}"><span class="dot ${dot}"></span>
      <div class="main"><div class="name">${esc(name)}${state}</div>
        <div class="meta">${tag}<span class="id">${esc(d.id)}</span>${meta ? ' · ' + meta : ''}</div>
        ${d.reporting ? '' : `<div class="meta" title="${esc(T('no_report'))}">${esc(T('no_report'))}</div>`}
        ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}</div>
      <div class="btns"><a class="dk-btn primary" data-act="connect" href="rustdesk://connection/new/${encodeURIComponent(d.id)}">${esc(T('connect'))}</a>
        <button class="dk-btn" data-act="copy">${esc(T('copy'))} ID</button>
        <button class="dk-btn" data-act="edit">${esc(T('edit'))}</button>
        <button class="dk-btn danger" data-act="remove">${esc(T('remove'))}</button></div></li>`;
  }).join('');
  const empty = $('devs-empty');
  empty.style.display = list.length ? 'none' : '';
  empty.textContent = devs.length ? T('empty_search') : T('empty');
}
async function loadDevices() {
  try { devs = await api('api/devices'); renderDevices(); } catch (e) { notify(e.message, 'error'); }
}

async function loadLogs() {
  try {
    const r = await api('api/logs?proc=' + $('log-proc').value);
    const el = $('logs'); el.textContent = r.lines.join('\n') || '—'; el.scrollTop = el.scrollHeight;
  } catch (e) { $('logs').textContent = e.message; }
}
async function loadClientVersion() {
  $('dl-ver').textContent = '';
  try { const r = await api('api/client-version'); $('dl-ver').textContent = T('dl_ver', { v: r.version }); } catch (_) {}
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = T('copied'); setTimeout(() => { btn.textContent = old; }, 1400); }
}

document.querySelectorAll('.dk-nav').forEach((b) => b.addEventListener('click', () => show(b.dataset.pane)));
document.addEventListener('click', (ev) => {
  const c = ev.target.closest('[data-copy]');
  if (c) { const v = $(c.dataset.copy).textContent; if (v && v !== '—' && v !== '…') copyText(v, c); }
  const a = ev.target.closest('a.disabled'); if (a) ev.preventDefault();
});
$('search').addEventListener('input', renderDevices);
// « Se connecter » : lien rustdesk://, ouvert par Windows seulement si RustDesk est installé sur cet ordinateur (la
// version portable n'enregistre pas ces liens ; rien ne se passe alors). L'ID est copié dans tous les cas, et si
// aucune application n'a pris la main au bout de 2 s, une explication s'affiche sous le poste.
$('devs').addEventListener('click', (ev) => {
  const a = ev.target.closest('a[data-act=connect]'); if (!a) return;
  const li = a.closest('li'), id = li.dataset.id;
  copyText(id);
  let left = false;
  const onBlur = () => { left = true; };
  window.addEventListener('blur', onBlur, { once: true });
  setTimeout(() => {
    window.removeEventListener('blur', onBlur);
    if (left || !document.hasFocus() || li.querySelector('.hint')) return;
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = T('connect_hint', { id });
    li.appendChild(h);
    setTimeout(() => h.remove(), 20000);
  }, 2000);
});
$('devs').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('li').dataset.id, d = devs.find((x) => x.id === id); if (!d) return;
  if (b.dataset.act === 'copy') return copyText(id, b);
  if (b.dataset.act === 'edit') {
    editing = id; $('edit-id').textContent = id + (d.hostname ? ' · ' + d.hostname : '');
    $('edit-label').value = d.label; $('edit-note').value = d.note; $('edit-group').value = d.group || '';
    $('groups').innerHTML = [...new Set(devs.map((x) => x.group).filter(Boolean))].sort().map((g) => `<option value="${esc(g)}">`).join('');
    $('edit').showModal(); $('edit-label').focus(); return;
  }
  if (b.dataset.act === 'remove' && confirm(T('remove_q', { n: d.label || d.hostname || id }))) {
    try { await api('api/devices/' + encodeURIComponent(id), { method: 'DELETE' }); await loadDevices(); loadState(); }
    catch (e) { alert(e.message); }
  }
});
$('edit-cancel').addEventListener('click', () => $('edit').close());
$('edit-save').addEventListener('click', async () => {
  try {
    await api('api/devices/' + encodeURIComponent(editing), { method: 'PUT', body: JSON.stringify({ label: $('edit-label').value, group: $('edit-group').value, note: $('edit-note').value }) });
    $('edit').close(); loadDevices();
  } catch (e) { alert(e.message); }
});
$('restart').addEventListener('click', async () => {
  try { await api('api/restart', { method: 'POST' }); $('restart-msg').textContent = T('restart_ok'); setTimeout(() => { $('restart-msg').textContent = ''; loadState(); }, 3000); }
  catch (e) { alert(e.message); }
});
$('ps-pw').addEventListener('change', () => { const q = $('ps-pw').checked ? '?password=1' : ''; $('dl-ps').href = 'deploy/windows.cmd' + q; $('dl-ps1').href = 'deploy/windows.ps1' + q; });
$('log-proc').addEventListener('change', loadLogs);
document.querySelectorAll('dialog [data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));

// Techniciens
$('api-url').addEventListener('input', () => { apiDirty = true; });
$('api-save').addEventListener('click', async () => {
  const m = $('api-msg');
  try {
    await api('api/settings', { method: 'PUT', body: JSON.stringify({ apiUrl: $('api-url').value.trim() }) });
    apiDirty = false; m.className = 'okc'; m.textContent = T('api_saved'); loadState();
  } catch (e) { m.className = 'err'; m.textContent = e.message; }
});
$('t-gen').addEventListener('click', () => { $('t-pw').value = genPassword(); });
$('t-add').addEventListener('click', async () => {
  const m = $('t-msg');
  try {
    await api('api/techs', { method: 'POST', body: JSON.stringify({ name: $('t-name').value.trim().toLowerCase(), display: $('t-display').value.trim(), password: $('t-pw').value }) });
    m.className = 'okc'; m.textContent = T('acc_created');
    $('t-name').value = ''; $('t-display').value = '';
    setTimeout(() => { $('t-pw').value = ''; }, 60000);
    loadTechs(); loadState();
  } catch (e) { m.className = 'err'; m.textContent = e.message; }
});
$('techs').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-t-act]'); if (!b) return;
  const name = b.closest('li').dataset.name, t = techs.find((x) => x.name === name); if (!t) return;
  const url = 'api/techs/' + encodeURIComponent(name), act = b.dataset.tAct;
  try {
    if (act === 'pw') { pwFor = name; $('pwd-name').textContent = name; $('pwd-val').value = ''; $('pwd').showModal(); $('pwd-val').focus(); return; }
    if (act === '2fa-on') {
      const r = await api(url + '/totp', { method: 'POST' });
      totpFor = name; $('totp-secret').textContent = r.secret.replace(/(.{4})/g, '$1 ').trim(); $('totp-uri').href = r.uri;
      $('totp-code').value = ''; $('totp-msg').textContent = ''; $('totp').showModal(); $('totp-code').focus(); return;
    }
    if (act === '2fa-off') { if (!confirm(T('tf_off_q', { n: name }))) return; await api(url + '/totp', { method: 'DELETE' }); }
    if (act === 'toggle') await api(url, { method: 'PUT', body: JSON.stringify({ disabled: !t.disabled }) });
    if (act === 'logout') { await api(url + '/logout', { method: 'POST' }); notify(T('logout_ok')); }
    if (act === 'del') { if (!confirm(T('del_q', { n: name }))) return; await api(url, { method: 'DELETE' }); loadState(); }
    loadTechs();
  } catch (e) { alert(e.message); }
});
$('pwd-gen').addEventListener('click', () => { $('pwd-val').value = genPassword(); });
$('pwd-save').addEventListener('click', async () => {
  try { await api('api/techs/' + encodeURIComponent(pwFor), { method: 'PUT', body: JSON.stringify({ password: $('pwd-val').value }) }); $('pwd').close(); loadTechs(); }
  catch (e) { alert(e.message); }
});
$('totp-ok').addEventListener('click', async () => {
  try { await api('api/techs/' + encodeURIComponent(totpFor) + '/totp/confirm', { method: 'POST', body: JSON.stringify({ code: $('totp-code').value }) }); $('totp').close(); loadTechs(); }
  catch (e) { $('totp-msg').textContent = e.message; }
});
$('log-refresh').addEventListener('click', loadLogs);

if (window.desktroo) desktroo.onTheme((t) => { const l = pickLang(t && t.lang); if (l !== LANG) { LANG = l; applyLang(); } });
LANG = pickLang(document.documentElement.lang === 'fr' ? (navigator.language || 'fr') : document.documentElement.lang);
applyLang();
loadState(); loadDevices();
setInterval(() => { if (document.hidden) return; loadState(); if (current === 'devices') loadDevices(); }, 10000);
</script>
</body>
</html>
